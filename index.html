<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐷 私人影院 - 稳定直连版</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/dplayer@latest"></script>
    <style>
        :root { --primary: #ff85a2; --bg: #0a0a0a; --card: #1a1a1a; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
        header { display: flex; gap: 8px; margin-bottom: 15px; }
        input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #000; color: #fff; }
        .btn { padding: 10px 18px; border-radius: 6px; border: none; background: var(--primary); color: #fff; font-weight: bold; cursor: pointer; }
        #player-box { display: none; margin-bottom: 20px; border: 1px solid #333; border-radius: 12px; overflow: hidden; background: #000; }
        #dplayer { width: 100%; height: 450px; }
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 8px; padding: 12px; background: #151515; }
        .ep-btn { background: #333; color: #ccc; border: 1px solid #444; padding: 6px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        .ep-btn.active { background: var(--primary); color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        .card { background: var(--card); border-radius: 8px; overflow: hidden; border: 1px solid #333; cursor: pointer; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card div { padding: 8px; text-align: center; font-size: 12px; }
    </style>
</head>
<body>
    <header>
        <input type="text" id="kw" placeholder="输入片名搜索...">
        <button class="btn" onclick="search()">搜索</button>
    </header>
    <div id="player-box">
        <div id="dplayer"></div>
        <div id="epGrid" class="ep-grid"></div>
    </div>
    <div id="mainGrid" class="grid"></div>

<script>
    // 直接调用 API，不再通过 herokuapp 代理
    const API = "https://cj.lziapi.com/api.php/provide/vod/";
    let dp = null;

    window.onload = () => load(`&h=24`);

    async function load(p) {
        try {
            const res = await fetch(`${API}?ac=videolist${p}`);
            const data = await res.json();
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = "";
            data.list.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<img src="${item.vod_pic}"><div>${item.vod_name}</div>`;
                div.onclick = () => showPlayer(item);
                grid.appendChild(div);
            });
        } catch(e) { console.error("API请求受阻"); }
    }

    function search() {
        const v = document.getElementById('kw').value;
        if(v) load(`&wd=${encodeURIComponent(v)}`);
    }

    function showPlayer(item) {
        document.getElementById('player-box').style.display = 'block';
        window.scrollTo({top: 0, behavior: 'smooth'});
        const grid = document.getElementById('epGrid');
        grid.innerHTML = "";
        const eps = item.vod_play_url.split('$$$')[0].split('#');

        eps.forEach((ep, i) => {
            const info = ep.split('$');
            if(info.length < 2) return;
            const btn = document.createElement('button');
            btn.className = 'ep-btn';
            btn.innerText = info[0];
            btn.onclick = () => {
                document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if(dp) dp.destroy();
                dp = new DPlayer({
                    container: document.getElementById('dplayer'),
                    video: { url: info[1], type: 'hls' }
                });
            };
            grid.appendChild(btn);
            if(i === 0) btn.click();
        });
    }
</script>
</body>
</html>
