<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐷 私人影院 - 弹窗直达版</title>
    <style>
        :root { --primary: #ff85a2; --bg: #0a0a0a; --card: #1a1a1a; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { display: flex; gap: 8px; margin-bottom: 15px; }
        input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #000; color: #fff; outline: none; }
        .btn { padding: 10px 18px; border-radius: 6px; border: none; background: var(--primary); color: #fff; font-weight: bold; cursor: pointer; }
        
        /* 播放控制区 */
        #player-box { display: none; margin-bottom: 20px; border: 1px solid #333; border-radius: 12px; background: #1a1a1a; padding: 20px; text-align: center; }
        .play-hint { margin-bottom: 15px; color: #ff85a2; font-size: 14px; font-weight: bold; }
        .line-bar { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .line-btn { background: #444; color: #fff; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; }
        .line-btn:hover { background: var(--primary); }

        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 8px; max-height: 200px; overflow-y: auto; background: #000; padding: 10px; border-radius: 8px; }
        .ep-btn { background: #333; color: #ccc; border: 1px solid #444; padding: 6px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        .ep-btn.active { background: var(--primary); color: #fff; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        .card { background: var(--card); border-radius: 8px; overflow: hidden; border: 1px solid #333; cursor: pointer; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card div { padding: 8px; text-align: center; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <input type="text" id="kw" placeholder="输入片名搜索...">
        <button class="btn" onclick="search()">搜索</button>
    </header>

    <div id="player-box">
        <div class="play-hint">⚠️ 网页播放器已被拦截，请点击下方线路跳转播放 ⚠️</div>
        <div class="line-bar">
            <button class="line-btn" onclick="openVideo(0)">🚀 线路1 (新窗口播放)</button>
            <button class="line-btn" onclick="openVideo(1)">📺 线路2 (备用)</button>
        </div>
        <div id="epGrid" class="ep-grid"></div>
    </div>

    <div id="mainGrid" class="grid"></div>
</div>

<script>
    const API = "https://cj.lziapi.com/api.php/provide/vod/";
    const JX_LIST = [
        "https://jx.777jiexi.com/player/?url=",
        "https://jx.aidouer.net/?url="
    ];
    let currentVUrl = "";

    window.onload = () => load(`&h=24`);

    async function load(p) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:50px;">正在获取资源...</div>`;
        try {
            const res = await fetch(`${API}?ac=videolist${p}`);
            const data = await res.json();
            grid.innerHTML = "";
            data.list.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<img src="${item.vod_pic}"><div>${item.vod_name}</div>`;
                div.onclick = () => showControl(item);
                grid.appendChild(div);
            });
        } catch(e) { grid.innerHTML = "网络不稳定"; }
    }

    function search() {
        const v = document.getElementById('kw').value;
        if(v) load(`&wd=${encodeURIComponent(v)}`);
    }

    function showControl(item) {
        document.getElementById('player-box').style.display = 'block';
        window.scrollTo({top: 0, behavior: 'smooth'});
        const grid = document.getElementById('epGrid');
        grid.innerHTML = "";
        const eps = item.vod_play_url.split('$$$')[0].split('#');

        eps.forEach((ep, i) => {
            const info = ep.split('$');
            if(info.length < 2) return;
            const btn = document.createElement('button');
            btn.className = 'ep-btn';
            btn.innerText = info[0];
            btn.onclick = () => {
                document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentVUrl = info[1];
                openVideo(0); // 选中集数时自动尝试打开线路1
            };
            grid.appendChild(btn);
        });
    }

    function openVideo(idx) {
        if(!currentVUrl) {
            alert("请先选择集数");
            return;
        }
        const playUrl = JX_LIST[idx] + currentVUrl;
        // 关键：直接弹出新窗口，彻底绕过原网页的加载失败限制
        window.open(playUrl, '_blank');
    }
</script>
</body>
</html>
