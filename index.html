<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极简私人影院</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/artplayer/dist/artplayer.js"></script>
    <style>
        :root { --bg: #0b0c10; --card: #1f2833; --accent: #66fcf1; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 40px; background: #000; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #333; }
        .search-bar { display: flex; background: #222; border-radius: 20px; padding: 5px 15px; border: 1px solid #444; }
        .search-bar input { background: transparent; border: none; color: #fff; outline: none; width: 200px; }
        
        /* Player Area */
        .player-container { width: 100%; background: #000; padding: 20px 0; display: none; border-bottom: 2px solid var(--accent); }
        .player-container.active { display: block; }
        #artplayer { width: 90%; max-width: 1000px; height: 500px; margin: 0 auto; border-radius: 8px; overflow: hidden; }
        .episode-list { width: 90%; max-width: 1000px; margin: 15px auto; display: flex; flex-wrap: wrap; gap: 10px; }
        .ep-btn { background: #333; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .ep-btn:hover { background: var(--accent); color: #000; }
        .ep-btn.active { background: var(--accent); color: #000; font-weight: bold; }

        /* Grid */
        .content { padding: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .card { background: var(--card); border-radius: 10px; overflow: hidden; cursor: pointer; transition: 0.3s; position: relative; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 5px 15px rgba(102, 252, 241, 0.2); }
        .card img { width: 100%; height: 230px; object-fit: cover; }
        .card-name { padding: 10px; font-size: 14px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .remark { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.7); color: var(--accent); font-size: 10px; padding: 2px 5px; border-radius: 3px; }

        .pagination { text-align: center; margin: 40px; }
        button.nav-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); padding: 8px 20px; cursor: pointer; border-radius: 5px; margin: 0 10px; }
        button:disabled { border-color: #444; color: #444; }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <div style="font-size: 22px; color: var(--accent); font-weight: bold;">AI 影院</div>
            <div class="search-bar">
                <input v-model="wd" @keyup.enter="search" placeholder="输入关键词...">
                <button @click="search" style="background:none; border:none; cursor:pointer;">🔍</button>
            </div>
        </div>

        <div :class="['player-container', { active: currentVod }]">
            <div id="artplayer"></div>
            <div class="episode-list">
                <button v-for="(ep, index) in playlist" 
                        :key="index" 
                        :class="['ep-btn', { active: currentEpIndex === index }]"
                        @click="playVideo(ep.url, index)">
                    {{ ep.name }}
                </button>
            </div>
            <div style="text-align: center; padding: 10px; color: #888;">正在播放：{{ currentVod?.vod_name }} - {{ playlist[currentEpIndex]?.name }}</div>
        </div>

        <div class="content">
            <div class="grid">
                <div v-for="item in list" :key="item.vod_id" class="card" @click="getDetails(item.vod_id)">
                    <span class="remark">{{ item.vod_remarks }}</span>
                    <img :src="item.vod_pic" referrerpolicy="no-referrer">
                    <div class="card-name">{{ item.vod_name }}</div>
                </div>
            </div>

            <div class="pagination">
                <button class="nav-btn" @click="goPage(page - 1)" :disabled="page <= 1">上一页</button>
                <span>{{ page }} / {{ pageCount }}</span>
                <button class="nav-btn" @click="goPage(page + 1)" :disabled="page >= pageCount">下一页</button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const api = 'https://360zyzz.com/api.php/provide/vod/';
                const list = ref([]);
                const page = ref(1);
                const pageCount = ref(1);
                const wd = ref('');
                const currentVod = ref(null);
                const playlist = ref([]);
                const currentEpIndex = ref(0);
                let art = null;

                const fetchData = async (p = 1, keyword = '') => {
                    let url = `${api}?ac=videolist&pg=${p}`;
                    if (keyword) url += `&wd=${encodeURIComponent(keyword)}`;
                    const res = await axios.get(url);
                    list.value = res.data.list;
                    page.value = parseInt(res.data.page);
                    pageCount.value = parseInt(res.data.pagecount);
                };

                const getDetails = async (id) => {
                    const res = await axios.get(`${api}?ac=detail&ids=${id}`);
                    const vod = res.data.list[0];
                    currentVod.value = vod;
                    
                    // 解析选集列表 (格式: 第01集$url#第02集$url)
                    const rawList = vod.vod_play_url.split('#');
                    playlist.value = rawList.map(item => {
                        const parts = item.split('$');
                        return { name: parts[0], url: parts[1] };
                    });
                    
                    // 默认播放第一集
                    playVideo(playlist.value[0].url, 0);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };

                const playVideo = (url, index) => {
                    currentEpIndex.value = index;
                    if (art) art.destroy();

                    art = new Artplayer({
                        container: '#artplayer',
                        url: url,
                        type: 'm3u8',
                        autoplay: true,
                        fullscreen: true,
                        setting: true,
                        customType: {
                            m3u8: function (video, url) {
                                if (Hls.isSupported()) {
                                    const hls = new Hls();
                                    hls.loadSource(url);
                                    hls.attachMedia(video);
                                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                                    video.src = url;
                                }
                            },
                        },
                    });
                };

                const search = () => { page.value = 1; fetchData(1, wd.value); };
                const goPage = (p) => fetchData(p, wd.value);

                onMounted(() => fetchData());

                return { list, page, pageCount, wd, currentVod, playlist, currentEpIndex, search, goPage, getDetails, playVideo };
            }
        }).mount('#app');
    </script>
</body>
</html>
