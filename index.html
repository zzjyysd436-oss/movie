<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐷 私人影院 (稳定版)</title>
    <style>
        :root { --primary: #ff85a2; --bg: #0a0a0a; --card: #1a1a1a; }
        body { font-family: sans-serif; background: var(--bg); color: #fff; margin: 0; padding: 10px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { display: flex; gap: 8px; margin-bottom: 15px; }
        input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #444; background: #000; color: #fff; }
        .btn { padding: 10px 18px; border-radius: 6px; border: none; background: var(--primary); color: #fff; font-weight: bold; cursor: pointer; }
        
        /* 播放区：不再使用 DPlayer，改用万能解析内核 */
        #player-box { display: none; margin-bottom: 20px; border: 1px solid #333; border-radius: 12px; overflow: hidden; background: #000; }
        .iframe-wrap { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .ep-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; padding: 12px; max-height: 150px; overflow-y: auto; background: #151515; }
        .ep-btn { background: #333; color: #ccc; border: 1px solid #444; padding: 6px; border-radius: 4px; font-size: 11px; cursor: pointer; }
        .ep-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        .card { background: var(--card); border-radius: 8px; overflow: hidden; border: 1px solid #333; cursor: pointer; }
        .card img { width: 100%; height: 180px; object-fit: cover; }
        .card div { padding: 8px; text-align: center; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <input type="text" id="kw" placeholder="输入你想看的..." onkeydown="if(event.keyCode==13) search()">
        <button class="btn" onclick="search()">搜索</button>
    </header>

    <div id="player-box">
        <div class="iframe-wrap"><iframe id="ifr" allowfullscreen="true" scrolling="no"></iframe></div>
        <div id="epGrid" class="ep-grid"></div>
    </div>

    <div id="mainGrid" class="grid"></div>
</div>

<script>
    // 直接连接量子资源 API
    const API = "https://cj.lziapi.com/api.php/provide/vod/";
    // 使用专业稳定的解析接口，彻底避开 herokuapp
    const JX_API = "https://jx.jsonplayer.com/player/?url=";

    window.onload = () => load(`&h=24`);

    async function load(p) {
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:50px;">📡 正在拉取影视库...</div>`;
        try {
            const res = await fetch(`${API}?ac=videolist${p}`);
            const data = await res.json();
            grid.innerHTML = "";
            data.list.forEach(item => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<img src="${item.vod_pic}"><div>${item.vod_name}</div>`;
                div.onclick = () => showEpisodes(item);
                grid.appendChild(div);
            });
        } catch(e) { grid.innerHTML = "网络同步受限，请重试"; }
    }

    function search() {
        const v = document.getElementById('kw').value;
        if(v) load(`&wd=${encodeURIComponent(v)}`);
    }

    function showEpisodes(item) {
        document.getElementById('player-box').style.display = 'block';
        window.scrollTo({top: 0, behavior: 'smooth'});
        const grid = document.getElementById('epGrid');
        grid.innerHTML = "";
        
        // 解析播放地址
        const rawUrl = item.vod_play_url.split('$$$')[0];
        const eps = rawUrl.split('#');

        eps.forEach((ep, i) => {
            const info = ep.split('$');
            if(info.length < 2) return;
            const btn = document.createElement('button');
            btn.className = 'ep-btn';
            btn.innerText = info[0];
            btn.onclick = () => {
                document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                // 核心：直接把视频地址丢给万能解析，跳过所有 CORS 限制
                document.getElementById('ifr').src = JX_API + info[1];
            };
            grid.appendChild(btn);
            if(i === 0) btn.click();
        });
    }
</script>
</body>
</html>
